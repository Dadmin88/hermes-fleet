name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  rust-f0:
    name: Rust workspace compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust compatibility and persistence tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build locked Rust workspace
        run: cargo build --locked --workspace --all-targets --all-features

  real-proofs:
    name: Real Nodescale and readiness proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.1

      - name: Build Fleet managed-control binary
        run: cargo build --locked --workspace

      - name: Check out pinned Nodescale revision
        run: |
          git init --quiet "$RUNNER_TEMP/nodescale-n7"
          git -C "$RUNNER_TEMP/nodescale-n7" remote add origin https://github.com/Dadmin88/hermes-nodescale.git
          git -C "$RUNNER_TEMP/nodescale-n7" fetch --depth 1 origin c0a9a7c873d7086375ac53245e6fd689a3686c7d
          git -C "$RUNNER_TEMP/nodescale-n7" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nodescale-n7" rev-parse HEAD)" = "c0a9a7c873d7086375ac53245e6fd689a3686c7d"

      - name: Prove real Nodescale Rust client to Rust Fleet service
        run: |
          python3 proofs/managed-control/run_nodescale_rust_e2e.py \
            --nodescale-root "$RUNNER_TEMP/nodescale-n7" \
            --fleet-binary target/debug/fleet-managed-control \
            --cargo cargo

      - name: Prove layered node readiness and restart recovery
        run: |
          python3 proofs/node-readiness/run_readiness_e2e.py \
            --nodescale-root "$RUNNER_TEMP/nodescale-n7" \
            --fleet-binary target/debug/fleet-managed-control \
            --cargo cargo

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Fleet development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Check patch whitespace
        run: git diff --check

      - name: Run tests without the Hermes integration smoke
        run: python -m pytest -q --ignore=tests/test_plugin_installation.py

      - name: Lint
        run: ruff check hermes_fleet tests

      - name: Check formatting
        run: ruff format --check hermes_fleet tests

      - name: Build Python package
        run: python -m build

      - name: Clean-install wheel and smoke operational entry points
        run: |
          python -m venv "$RUNNER_TEMP/fleet-wheel"
          "$RUNNER_TEMP/fleet-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/fleet-wheel/bin/fleet-node" --help >/dev/null
          "$RUNNER_TEMP/fleet-wheel/bin/fleet-managed-projection" --help >/dev/null
          "$RUNNER_TEMP/fleet-wheel/bin/python" -c 'from hermes_fleet.node_service import _build_card; assert _build_card(False).name == "hermes-fleet-node"'

      - name: Upload built package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-fleet-dist-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  plugin-smoke:
    name: Hermes plugin clean-install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check out verified Hermes source
        run: |
          git init --quiet "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin a991dfc25daf68994c21d6adcdfbafb1b3dc23cf
          git -C "$RUNNER_TEMP/hermes-agent" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "a991dfc25daf68994c21d6adcdfbafb1b3dc23cf"

      - name: Install verified Hermes and Fleet test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          python -m pip install -e ".[dev]" build

      - name: Verify Hermes CLI
        run: hermes --help >/dev/null

      - name: Run complete Fleet test suite
        run: python -m pytest -q
