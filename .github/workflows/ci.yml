name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  rust-compatibility:
    name: Rust workspace compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust compatibility and persistence tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build locked Rust workspace
        run: cargo build --locked --workspace --all-targets --all-features

  real-proofs:
    name: Real Nodescale and readiness proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.1

      - name: Build Fleet managed-control binary
        run: cargo build --locked --workspace

      - name: Check out pinned Nodescale revision
        run: |
          git init --quiet "$RUNNER_TEMP/nodescale-compat"
          git -C "$RUNNER_TEMP/nodescale-compat" remote add origin https://github.com/Dadmin88/hermes-nodescale.git
          git -C "$RUNNER_TEMP/nodescale-compat" fetch --depth 1 origin c0a9a7c873d7086375ac53245e6fd689a3686c7d
          git -C "$RUNNER_TEMP/nodescale-compat" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nodescale-compat" rev-parse HEAD)" = "c0a9a7c873d7086375ac53245e6fd689a3686c7d"

      - name: Prove real Nodescale Rust client to Rust Fleet service
        run: |
          python3 proofs/managed-control/run_nodescale_rust_e2e.py \
            --nodescale-root "$RUNNER_TEMP/nodescale-compat" \
            --fleet-binary target/debug/fleet-managed-control \
            --cargo cargo

      - name: Prove layered node readiness and restart recovery
        run: |
          python3 proofs/node-readiness/run_readiness_e2e.py \
            --nodescale-root "$RUNNER_TEMP/nodescale-compat" \
            --fleet-binary target/debug/fleet-managed-control \
            --cargo cargo

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Fleet development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Check patch whitespace
        run: git diff --check

      - name: Check public repository hygiene
        run: python scripts/check_public_hygiene.py

      - name: Check Desktop runtime plugin syntax
        run: node --check desktop/plugin.js

      - name: Run tests without the Hermes integration smoke
        run: python -m pytest -q --ignore=tests/test_plugin_installation.py

      - name: Lint
        run: ruff check hermes_fleet dashboard scripts tests

      - name: Check formatting
        run: ruff format --check hermes_fleet dashboard scripts tests

      - name: Build Python package
        run: python -m build

      - name: Clean-install wheel and smoke operational entry points
        run: |
          python -m venv "$RUNNER_TEMP/fleet-wheel"
          "$RUNNER_TEMP/fleet-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/fleet-wheel/bin/fleet-node" --help >/dev/null
          "$RUNNER_TEMP/fleet-wheel/bin/fleet-managed-projection" --help >/dev/null
          "$RUNNER_TEMP/fleet-wheel/bin/python" -c 'from hermes_fleet.node_service import _build_card; assert _build_card(False).name == "hermes-fleet-node"'

      - name: Upload built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-fleet-dist-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  plugin-smoke:
    name: Hermes plugin clean-install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check out verified Hermes source
        run: |
          git init --quiet "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/Dadmin88/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin 698c89f711d5b34103e05e1193f9d5fb72212fd8
          git -C "$RUNNER_TEMP/hermes-agent" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "698c89f711d5b34103e05e1193f9d5fb72212fd8"

      - name: Install verified Hermes and Fleet test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
          python -m pip install -e ".[dev]" build

      - name: Install Phase 17 disposable-runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap --version

      - name: Verify Hermes CLI
        run: hermes --help >/dev/null

      - name: Verify Hermes Fleet runtime seam
        run: |
          python - <<'PY'
          from agent.fleet_runtime_scope import (
              FleetRuntimeBinding,
              fleet_runtime_scope,
              get_fleet_runtime,
          )

          payload = {
              "version": "fleet-run-v1",
              "container_id": "a" * 64,
              "plan_fingerprint": "sha256:" + "b" * 64,
              "image": "example.invalid/fleet-workshop@sha256:" + "c" * 64,
              "toolsets": ["fleet-terminal"],
              "max_iterations": 8,
          }
          binding = FleetRuntimeBinding.from_request(payload)
          assert binding.to_request() == payload
          assert get_fleet_runtime() is None
          with fleet_runtime_scope(binding):
              assert get_fleet_runtime() is binding
          assert get_fleet_runtime() is None
          PY

      - name: Verify Hermes Fleet scoped-memory seam
        run: |
          python - <<'PY'
          from agent.fleet_memory_scope import (
              FleetMemoryBinding,
              FleetMemoryScopeRef,
              fleet_memory_scope,
              get_fleet_memory,
          )

          principal_id = "sha256:" + "1" * 64
          private = FleetMemoryScopeRef("principal", principal_id)
          payload = {
              "version": "fleet-memory-v1",
              "principal": {
                  "principal_id": principal_id,
                  "kind": "owner",
                  "generation": 1,
                  "binding_hash": "sha256:" + "2" * 64,
              },
              "agent_instance_id": "sha256:" + "3" * 64,
              "source_run": "fleet-ci",
              "read_scopes": [private.to_request()],
              "write_scope": private.to_request(),
              "retention_until_ms": None,
          }
          binding = FleetMemoryBinding.from_request(payload)
          assert binding.to_request() == payload
          assert get_fleet_memory() is None
          with fleet_memory_scope(binding):
              assert get_fleet_memory() is binding
          assert get_fleet_memory() is None
          PY

      - name: Verify Hermes Fleet context-firewall seam
        run: |
          python - <<'PY'
          from agent.fleet_context_scope import FleetContextBinding

          payload = {
              "version": "fleet-context-v1",
              "principal": {
                  "principal_id": "sha256:" + "1" * 64,
                  "kind": "owner",
                  "generation": 1,
                  "binding_hash": "sha256:" + "2" * 64,
              },
              "agent_instance_id": "sha256:" + "3" * 64,
              "base_manifest_digest": "sha256:" + "4" * 64,
              "run_authority_hash": "sha256:" + "5" * 64,
          }
          assert FleetContextBinding.from_request(payload).to_request() == payload
          PY

      - name: Verify Hermes Phase 13 interception seam
        run: |
          python - <<'PY'
          from agent.sensitive_interception import intercept_persistence

          decision = intercept_persistence("ordinary-fleet-ci-text", sink="memory")
          assert decision.found is False
          assert decision.action == "allow"
          assert decision.persisted_text == "ordinary-fleet-ci-text"
          PY

      - name: Verify Hermes Phase 14 runtime-material seam
        run: |
          python - <<'PY'
          from agent.fleet_runtime_material import (
              FleetRuntimeMaterialHandle,
              FleetVaultBinding,
          )
          from hermes_secure_store import InjectionTarget

          handle = FleetRuntimeMaterialHandle(
              handle="hvh1_" + "A" * 32,
              injection_kind="env",
              injection_target="PROVIDER_KEY",
              version=1,
              expires_at_ms=2_000_000_000_000,
          )
          payload = {
              "version": "fleet-vault-v1",
              "run_id": "fleet-ci",
              "run_authority_hash": "sha256:" + "5" * 64,
              "handles": [handle.to_request()],
          }
          assert FleetVaultBinding.from_request(payload).to_request() == payload
          assert InjectionTarget("broker", "provider.auth").kind == "broker"
          PY

      - name: Verify Hermes Phase 15 skill-learning seam
        run: |
          python - <<'PY'
          from agent.fleet_skill_learning_scope import FleetSkillLearningBinding

          principal_id = "sha256:" + "1" * 64
          payload = {
              "version": "fleet-skill-learning-v1",
              "principal": {
                  "principal_id": principal_id,
                  "kind": "owner",
                  "generation": 1,
                  "binding_hash": "sha256:" + "2" * 64,
              },
              "agent_instance_id": "sha256:" + "3" * 64,
              "source_run": "fleet-ci",
              "scope": {"kind": "principal", "scope_id": principal_id},
              "run_authority_hash": "sha256:" + "4" * 64,
              "provenance": {
                  "recipe_hash": "sha256:" + "5" * 64,
                  "resolved_recipe_hash": "sha256:" + "6" * 64,
                  "plan_fingerprint": "sha256:" + "7" * 64,
                  "capabilities_hash": "sha256:" + "8" * 64,
                  "target_digest": "sha256:" + "9" * 64,
              },
              "needs": {
                  "tools": ["fleet-terminal"],
                  "filesystem": [],
                  "network": {
                      "mode": "none",
                      "policy_hash": "sha256:" + "a" * 64,
                  },
                  "secret_fingerprints": [],
              },
          }
          binding = FleetSkillLearningBinding.from_request(payload)
          assert binding.to_request() == payload
          assert binding.scope_kind == "principal"
          assert binding.scope_id == principal_id
          PY

      - name: Verify Hermes Phase 16/17 skill safety seam
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from textwrap import dedent

          import tools.skill_manager_tool as skill_manager
          from agent.fleet_skill_learning_scope import (
              FleetSkillLearningBinding,
              fleet_skill_learning_scope,
          )
          from tools.fleet_skill_quarantine import quarantine_skill_candidate
          from tools.fleet_skill_verification import verify_skill_candidate
          from tools.skill_provenance import (
              BACKGROUND_REVIEW,
              reset_current_write_origin,
              set_current_write_origin,
          )

          principal_id = "sha256:" + "1" * 64
          payload = {
              "version": "fleet-skill-learning-v1",
              "principal": {
                  "principal_id": principal_id,
                  "kind": "owner",
                  "generation": 1,
                  "binding_hash": "sha256:" + "2" * 64,
              },
              "agent_instance_id": "sha256:" + "3" * 64,
              "source_run": "fleet-ci-quarantine",
              "scope": {"kind": "principal", "scope_id": principal_id},
              "run_authority_hash": "sha256:" + "4" * 64,
              "provenance": {
                  "recipe_hash": "sha256:" + "5" * 64,
                  "resolved_recipe_hash": "sha256:" + "6" * 64,
                  "plan_fingerprint": "sha256:" + "7" * 64,
                  "capabilities_hash": "sha256:" + "8" * 64,
                  "target_digest": "sha256:" + "9" * 64,
              },
              "needs": {
                  "tools": ["fleet-terminal"],
                  "filesystem": [],
                  "network": {
                      "mode": "none",
                      "policy_hash": "sha256:" + "a" * 64,
                  },
                  "secret_fingerprints": [],
              },
          }
          binding = FleetSkillLearningBinding.from_request(payload)
          skill = dedent("""\
          ---
          name: fleet-ci-quarantine-helper
          description: Safe quarantine seam helper
          allowed-tools: Bash
          ---

          # Safe helper

          ```bash
          python build.py
          ```
          """)
          root = Path(tempfile.mkdtemp(prefix="fleet-phase16-")) / "skills"
          root.mkdir()
          skill_manager.SKILLS_DIR = root
          token = set_current_write_origin(BACKGROUND_REVIEW)
          try:
              with fleet_skill_learning_scope(binding):
                  created = json.loads(
                      skill_manager.skill_manage(
                          action="create",
                          name="fleet-ci-quarantine-helper",
                          content=skill,
                      )
                  )
          finally:
              reset_current_write_origin(token)
          assert created["candidate"] is True
          candidates = list((root / ".fleet" / "candidates").iterdir())
          assert len(candidates) == 1
          quarantine = quarantine_skill_candidate(candidates[0], expected_binding=binding)
          assert quarantine.state == "verification-ready"
          verified = verify_skill_candidate(candidates[0], expected_binding=binding)
          assert verified.verified is True
          checks = {(check.category, check.name): check for check in verified.checks}
          required = {
              ("positive-test", "bundle-readable"),
              ("positive-test", "scratch-write"),
              ("network-denial", "internet"),
              ("network-denial", "management-network"),
              ("filesystem-denial", "host-path:/etc/passwd"),
              ("secret-denial", "environment"),
              ("broker-denial", "broker-sockets"),
              ("broker-denial", "docker-socket"),
              ("privilege-denial", "non-root-uid"),
              ("privilege-denial", "effective-capabilities"),
              ("resource-bound", "cpu"),
              ("resource-bound", "address-space"),
              ("resource-bound", "file-size"),
              ("resource-bound", "open-files"),
              ("resource-bound", "processes"),
          }
          assert required <= set(checks)
          assert all(checks[key].passed for key in required)
          saved = json.loads((candidates[0] / "candidate.json").read_text())
          assert saved["state"] == "verification-ready"
          assert saved["active"] is False
          assert saved["authority"] == "none"
          assert saved["quarantine"]["immutable"] is True
          assert saved["quarantine"]["bundle_id"] == saved["content_hash"]
          assert saved["tests"]["state"] == "verified"
          assert saved["tests"]["content_hash"] == saved["content_hash"]
          assert saved["tests"]["quarantine_digest"] == saved["quarantine"]["digest"]
          assert saved["tests"]["next_phase"] == 18
          PY

      - name: Run complete Fleet test suite
        run: python -m pytest -q
