name: Bounded cancellation format repair

on:
  push:
    branches: [codex/fix-deadline-cancellation-blocking-worker]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format only the reviewed target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fleet Format Repair"
          git config user.email "fleet-format-repair@users.noreply.github.com"
          python -m pip install 'ruff>=0.6'
          ruff format hermes_fleet/fleet_node.py
          changed="$(git diff --name-only)"
          test "$changed" = "hermes_fleet/fleet_node.py" || {
            echo "Unexpected formatter changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          ruff check hermes_fleet/fleet_node.py
          ruff format --check hermes_fleet/fleet_node.py
          python -m compileall -q hermes_fleet
          git rm .github/workflows/format-repair.yml
          git add hermes_fleet/fleet_node.py
          git diff --cached --check
          git commit -m "style: format bounded cancellation repair"
          git push origin HEAD:codex/fix-deadline-cancellation-blocking-worker
