name: Desktop stack main reconciliation

on:
  push:
    branches: [feat/desktop-d1]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main with guarded resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fleet Reconciliation"
          git config user.email "fleet-reconciliation@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "crates/fleet-state/src/lib.rs" || {
              echo "Unexpected conflict set:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            }

            python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fleet-state/src/lib.rs")
          text = path.read_text()
          marker = "<<<<<<< HEAD\n"
          separator = "=======\n"
          end = ">>>>>>> origin/main\n"
          hunks = []
          parts = []
          cursor = 0

          while marker in text[cursor:]:
              start = text.index(marker, cursor)
              parts.append(text[cursor:start])
              ours_start = start + len(marker)
              middle = text.index(separator, ours_start)
              theirs_start = middle + len(separator)
              finish = text.index(end, theirs_start)
              ours = text[ours_start:middle]
              theirs = text[theirs_start:finish]
              hunks.append((ours, theirs))

              if (
                  "Generation" in ours
                  and "ProfilePresence" in theirs
                  and "ResourceObservation" in theirs
                  and "pub struct" not in ours
                  and "pub struct" not in theirs
              ):
                  resolved = (
                      "    ApplyOutcome, FleetOperation, Generation, ManagedNodeState, ManagedOperation,\n"
                      "    ManagedProjectionRecord, NodeObservation, NodeReadiness, ObservationRecord, ProfilePresence,\n"
                      "    ProjectionApply, ProjectionDocument, ReadinessPolicy, RecoveryAction, ResourceObservation,\n"
                      "    RunBindingState, apply_projection, evaluate_readiness,\n"
                  )
              elif "pub struct ManagedNodeView" in ours and "pub struct ProfileNodeCandidate" in theirs and "pub struct ProfilePlacementCandidate" in theirs:
                  resolved = (
                      ours.rstrip()
                      + "\n}\n\n#[derive(Clone, Debug, Eq, PartialEq)]\n"
                      + theirs.lstrip()
                  )
              else:
                  raise SystemExit("Unexpected conflict hunk; refusing automatic resolution")

              parts.append(resolved)
              cursor = finish + len(end)

          parts.append(text[cursor:])
          if len(hunks) != 2:
              raise SystemExit(f"Expected exactly 2 conflict hunks, found {len(hunks)}")

          resolved_text = "".join(parts)
          if any(token in resolved_text for token in ("<<<<<<<", "=======", ">>>>>>>")):
              raise SystemExit("Conflict markers remain after resolution")
          path.write_text(resolved_text)
          PY

            git add crates/fleet-state/src/lib.rs
          fi

          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fleet-state/tests/desktop.rs")
          text = path.read_text()
          if "profiles:" not in text:
              needle = "        resources: ResourceObservation::default(),\n"
              if text.count(needle) != 1:
                  raise SystemExit("Unexpected Desktop observation fixture shape")
              text = text.replace(
                  needle,
                  "        profiles: Vec::new(),\n" + needle,
                  1,
              )
              path.write_text(text)
          PY

          cargo fmt --all
          node --check desktop/plugin.js
          python3 -m compileall -q hermes_fleet
          cargo check --workspace --all-targets --all-features --locked

          git rm .github/workflows/reconcile-main.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "merge: reconcile Fleet Desktop stack with current main"
          git push origin HEAD:feat/desktop-d1
