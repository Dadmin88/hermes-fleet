name: Combined schema fixture repair

on:
  push:
    branches: [feat/desktop-d1]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update only the stale profile-presence schema assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fleet Fixture Repair"
          git config user.email "fleet-fixture-repair@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/fleet-state/tests/profile_presence.rs')
          text = path.read_text()
          start = text.index('fn candidates_survive_store_restart_without_a_new_registry()')
          end = text.index('\n#[test]\nfn contradictory_persisted_admission_generation_fails_closed()', start)
          block = text[start:end]
          needle = 'assert_eq!(store.schema_version().unwrap(), 3);'
          needle2 = 'assert_eq!(restarted.schema_version().unwrap(), 3);'
          if block.count(needle) != 1 or block.count(needle2) != 1:
              raise SystemExit('Unexpected schema-version fixture shape')
          block = block.replace(needle, 'assert_eq!(store.schema_version().unwrap(), 4);', 1)
          block = block.replace(needle2, 'assert_eq!(restarted.schema_version().unwrap(), 4);', 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "crates/fleet-state/tests/profile_presence.rs" || {
            echo "Unexpected repair changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          cargo fmt --all --check
          cargo test --locked -p fleet-state --test profile_presence candidates_survive_store_restart_without_a_new_registry
          git rm .github/workflows/schema-fixture-repair.yml
          git add crates/fleet-state/tests/profile_presence.rs
          git diff --cached --check
          git commit -m "test: align profile restart fixture with schema v4"
          git push origin HEAD:feat/desktop-d1
