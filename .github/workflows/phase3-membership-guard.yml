name: Phase 3 Membership Guard

on:
  push:
    branches: [feat/desktop-membership-center]
    paths:
      - scripts/phase3_membership_patch.py
      - .github/workflows/phase3-membership-guard.yml

permissions:
  contents: write

concurrency:
  group: phase3-membership-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construct-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Apply deterministic Phase 3 patch
        run: python scripts/phase3_membership_patch.py

      - name: Format changed Python tests
        run: ruff format tests/unit/test_desktop_plugin_assets.py

      - name: Check Desktop runtime syntax
        run: node --check desktop/plugin.js

      - name: Run focused Desktop and hygiene tests
        run: >-
          python -m pytest -q
          tests/unit/test_desktop_plugin_assets.py
          tests/unit/test_public_hygiene.py

      - name: Run complete Python suite except separate clean-install smoke
        run: python -m pytest -q --ignore=tests/test_plugin_installation.py

      - name: Lint production and test code
        run: >-
          ruff check hermes_fleet dashboard scripts tests
          --exclude scripts/phase3_membership_patch.py

      - name: Check production and test formatting
        run: >-
          ruff format --check hermes_fleet dashboard scripts tests
          --exclude scripts/phase3_membership_patch.py

      - name: Check public repository hygiene
        run: python scripts/check_public_hygiene.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/plugin.js docs/desktop.md tests/unit/test_desktop_plugin_assets.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(desktop): build Fleet Membership Center"
          git push origin "HEAD:${GITHUB_REF_NAME}"
