[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fleet"
version = "0.1.0"
description = "Keryx-backed Hermes node communication and deliberate execution"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6,<7",
  "keryx @ git+https://github.com/Dadmin88/hermes-keryx.git@f4ee645e415600a959ea8062d1143140bd6c2616#subdirectory=sdk/python",
]

[project.scripts]
fleet-node = "hermes_fleet.node_service:main"
fleet-managed-projection = "hermes_fleet.managed_service:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["hermes_fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
