<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Profile Identity and Execution Locality</title>
<desc id="desc">Current native profile evidence compared with planned Recipe-based execution fabric.</desc>
<defs>
