  <marker id="ag" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#b6ff00"/></marker>
  <marker id="ap" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#a855f7"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:50px;font-weight:800;fill:#fff}.sub{font-size:21px;font-weight:500;fill:#cbd5e1}
    .laneG{font-size:19px;font-weight:800;letter-spacing:1.2px;fill:#b6ff00}.laneP{font-size:19px;font-weight:800;letter-spacing:1.2px;fill:#c084fc}
    .name{font-size:22px;font-weight:760;fill:#fff}.body{font-size:16px;font-weight:450;fill:#cbd5e1}.note{font-size:17px;font-weight:500;fill:#e2e8f0}.small{font-size:15px;font-weight:500;fill:#cbd5e1}
    .gcard{fill:#101827;stroke:#b6ff00;stroke-width:1.8}.pcard{fill:#101827;stroke:#a855f7;stroke-width:1.8}.muted{fill:#0d1523;stroke:#475569;stroke-width:1.5}
    .g{fill:none;stroke:#b6ff00;stroke-width:3;marker-end:url(#ag)}.p{fill:none;stroke:#a855f7;stroke-width:3;marker-end:url(#ap)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
