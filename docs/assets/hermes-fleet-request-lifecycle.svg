<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hermes Fleet Request Lifecycle</title>
<desc id="desc">High-contrast exact-node request lifecycle with direct Fleet and Hermes execution branches.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050812"/><stop offset="1" stop-color="#09111f"/></linearGradient>
  <marker id="ag" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#b6ff00"/></marker>
  <marker id="ap" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#a855f7"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:50px;font-weight:800;fill:#fff}.sub{font-size:21px;font-weight:500;fill:#cbd5e1}
    .stage{font-size:19px;font-weight:800;fill:#fff}.body{font-size:15px;font-weight:450;fill:#cbd5e1}.step{font-size:14px;font-weight:700;fill:#fff}
    .branch{font-size:17px;font-weight:800;fill:#b6ff00}.footer{font-size:17px;font-weight:500;fill:#e2e8f0}
    .card{fill:#101827;stroke:#a855f7;stroke-width:1.8}.cardG{fill:#101827;stroke:#b6ff00;stroke-width:1.8}.muted{fill:#0d1523;stroke:#334155;stroke-width:1.4}
    .g{fill:none;stroke:#b6ff00;stroke-width:3;marker-end:url(#ag)}.p{fill:none;stroke:#a855f7;stroke-width:3;marker-end:url(#ap)}.pd{fill:none;stroke:#a855f7;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#ap)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g transform="translate(32 28)"><path d="M6 8h44L33 18h27L31 30h27L27 43h20L22 56 12 39 2 32l20-3L9 21h27z" fill="#a855f7"/><text x="66" y="46" class="title">Hermes Fleet Request Lifecycle</text><text x="66" y="80" class="sub">How a Fleet request moves from operator to exact node and back</text></g>
<!-- Stage cards -->
<g>
  <rect x="18" y="160" width="160" height="305" rx="18" class="card"/><circle cx="98" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="98" y="163" text-anchor="middle" class="stage">1</text><text x="98" y="206" text-anchor="middle" class="stage">Operator /</text><text x="98" y="232" text-anchor="middle" class="stage">Calling Agent</text><circle cx="98" cy="290" r="27" fill="none" stroke="#b6ff00" stroke-width="3"/><circle cx="98" cy="279" r="9" fill="none" stroke="#b6ff00" stroke-width="3"/><path d="M80 310q18-22 36 0" fill="none" stroke="#b6ff00" stroke-width="3"/><text x="98" y="380" text-anchor="middle" class="body">Human or agent</text><text x="98" y="402" text-anchor="middle" class="body">issues a Fleet</text><text x="98" y="424" text-anchor="middle" class="body">request.</text>

  <rect x="260" y="160" width="160" height="305" rx="18" class="card"/><circle cx="340" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="340" y="163" text-anchor="middle" class="stage">2</text><text x="340" y="206" text-anchor="middle" class="stage">Fleet</text><text x="340" y="232" text-anchor="middle" class="stage">Controller</text><path d="M340 270l28 11v21c0 19-11 32-28 40-17-8-28-21-28-40v-21z" fill="none" stroke="#a855f7" stroke-width="4"/><path d="M326 304l10 11 20-25" fill="none" stroke="#fff" stroke-width="4"/><text x="340" y="380" text-anchor="middle" class="body">Authorizes request</text><text x="340" y="402" text-anchor="middle" class="body">and resolves the</text><text x="340" y="424" text-anchor="middle" class="body">exact target node.</text>

  <rect x="502" y="160" width="160" height="305" rx="18" class="card"/><circle cx="582" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="582" y="163" text-anchor="middle" class="stage">3</text><text x="582" y="206" text-anchor="middle" class="stage">Origin</text><text x="582" y="232" text-anchor="middle" class="stage">keryxd</text><g stroke="#a855f7" fill="none" stroke-width="3"><rect x="548" y="275" width="68" height="14" rx="4"/><rect x="548" y="297" width="68" height="14" rx="4"/><rect x="548" y="319" width="68" height="14" rx="4"/></g><text x="582" y="380" text-anchor="middle" class="body">Validates context</text><text x="582" y="402" text-anchor="middle" class="body">and prepares the</text><text x="582" y="424" text-anchor="middle" class="body">bounded request.</text>

  <rect x="744" y="160" width="160" height="305" rx="18" class="card"/><circle cx="824" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="824" y="163" text-anchor="middle" class="stage">4</text><text x="824" y="206" text-anchor="middle" class="stage">Keryx</text><text x="824" y="232" text-anchor="middle" class="stage">Routing / Relay</text><circle cx="824" cy="304" r="10" fill="none" stroke="#a855f7" stroke-width="3"/><circle cx="790" cy="304" r="7" fill="none" stroke="#a855f7" stroke-width="3"/><circle cx="858" cy="304" r="7" fill="none" stroke="#a855f7" stroke-width="3"/><circle cx="824" cy="270" r="7" fill="none" stroke="#a855f7" stroke-width="3"/><circle cx="824" cy="338" r="7" fill="none" stroke="#a855f7" stroke-width="3"/><path d="M797 304h17m20 0h17M824 277v17m0 20v17" stroke="#a855f7" stroke-width="3"/><text x="824" y="380" text-anchor="middle" class="body">Routes with</text><text x="824" y="402" text-anchor="middle" class="body">authentication and</text><text x="824" y="424" text-anchor="middle" class="body">durability.</text>

  <rect x="986" y="160" width="160" height="305" rx="18" class="card"/><circle cx="1066" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="1066" y="163" text-anchor="middle" class="stage">5</text><text x="1066" y="206" text-anchor="middle" class="stage">Destination</text><text x="1066" y="232" text-anchor="middle" class="stage">keryxd</text><g stroke="#a855f7" fill="none" stroke-width="3"><rect x="1032" y="275" width="68" height="14" rx="4"/><rect x="1032" y="297" width="68" height="14" rx="4"/><rect x="1032" y="319" width="68" height="14" rx="4"/></g><text x="1066" y="380" text-anchor="middle" class="body">Receives and</text><text x="1066" y="402" text-anchor="middle" class="body">forwards to the</text><text x="1066" y="424" text-anchor="middle" class="body">exact peer.</text>

  <rect x="1228" y="160" width="160" height="305" rx="18" class="card"/><circle cx="1308" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="1308" y="163" text-anchor="middle" class="stage">6</text><text x="1308" y="218" text-anchor="middle" class="stage">fleet-node</text><g stroke="#a855f7" fill="none" stroke-width="3"><rect x="1274" y="275" width="68" height="14" rx="4"/><rect x="1274" y="297" width="68" height="14" rx="4"/><rect x="1274" y="319" width="68" height="14" rx="4"/></g><text x="1308" y="372" text-anchor="middle" class="body">Validates destination,</text><text x="1308" y="394" text-anchor="middle" class="body">deadline, sender,</text><text x="1308" y="416" text-anchor="middle" class="body">operation, policy.</text>

  <rect x="1470" y="160" width="112" height="305" rx="18" class="card"/><circle cx="1526" cy="155" r="21" fill="#09111f" stroke="#b6ff00" stroke-width="3"/><text x="1526" y="163" text-anchor="middle" class="stage">7</text><text x="1526" y="206" text-anchor="middle" class="stage">Hermes</text><text x="1526" y="232" text-anchor="middle" class="stage">Runs API</text><rect x="1495" y="275" width="62" height="62" rx="12" fill="#09111f" stroke="#a855f7" stroke-width="2"/><path d="M1511 294l13 12-13 12m19 0h12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="1526" y="386" text-anchor="middle" class="body">Manages</text><text x="1526" y="408" text-anchor="middle" class="body">local runs.</text>
</g>
<!-- Main forward steps -->
<path d="M178 312H260" class="g"/><text x="219" y="275" text-anchor="middle" class="step">1. Request</text><text x="219" y="294" text-anchor="middle" class="step">exact node</text>
<path d="M420 312H502" class="g"/><text x="461" y="265" text-anchor="middle" class="step">2. Resolve target</text><text x="461" y="284" text-anchor="middle" class="step">+ authorize</text>
<path d="M662 312H744" class="g"/><text x="703" y="265" text-anchor="middle" class="step">3. Submit bounded</text><text x="703" y="284" text-anchor="middle" class="step">Fleet request</text>
<path d="M904 312H986" class="g"/><text x="945" y="265" text-anchor="middle" class="step">4. Authenticated</text><text x="945" y="284" text-anchor="middle" class="step">durable delivery</text>
<path d="M1146 312H1228" class="g"/><text x="1187" y="265" text-anchor="middle" class="step">5. Deliver to</text><text x="1187" y="284" text-anchor="middle" class="step">exact peer</text>
<path d="M1388 312H1470" class="g"/>
<!-- Direct branch -->
<text x="34" y="545" class="branch">A  Direct Fleet operation</text>
<rect x="175" y="510" width="255" height="112" rx="16" class="cardG"/><text x="302" y="544" text-anchor="middle" class="stage">fleet.health / fleet.inventory /</text><text x="302" y="570" text-anchor="middle" class="stage">fleet.message stay inside Fleet</text><text x="302" y="601" text-anchor="middle" class="body">No local Hermes run is started.</text>
<path d="M1308 465v100H430" class="g"/>
<text x="1110" y="550" class="step">direct result</text><text x="865" y="550" class="step">routed back</text><text x="620" y="550" class="step">returned to origin</text><text x="444" y="550" class="step">delivered to controller</text>
<!-- Executable branch -->
<text x="34" y="690" class="branch">B  fleet.hermes.run</text>
<rect x="200" y="645" width="250" height="115" rx="16" class="card"/><rect x="220" y="672" width="56" height="56" rx="10" fill="#09111f" stroke="#a855f7" stroke-width="2"/><path d="M234 687l12 12-12 12m18 0h10" fill="none" stroke="#fff" stroke-width="3.5"/><text x="300" y="685" class="stage">Start and observe</text><text x="300" y="712" class="stage">one local Hermes run</text>
<path d="M1308 465v210H1470" class="g"/><text x="1410" y="658" class="step">Start run</text>
<path d="M1526 465v258H1308" class="pd"/><text x="1390" y="747" class="step">run status / output</text>
<path d="M1308 723H450" class="g"/><text x="1105" y="707" class="step">bounded terminal result</text><text x="855" y="707" class="step">routed back</text><text x="610" y="707" class="step">returned to origin</text>
<path d="M200 723H98v-258" class="g"/><text x="116" y="750" class="step">delivered to operator</text>
<!-- Footer -->
<rect x="42" y="818" width="1516" height="64" rx="14" class="muted"/><path d="M84 838l17 7v12c0 12-7 20-17 25-10-5-17-13-17-25v-12z" fill="none" stroke="#a855f7" stroke-width="3"/><text x="120" y="857" class="footer">Direct Fleet operations never enter Hermes. Only the explicit executable operation, </text><text x="1010" y="857" class="footer" style="fill:#b6ff00;font-weight:800">fleet.hermes.run</text><text x="1150" y="857" class="footer">, starts a local Hermes run.</text>
</svg>