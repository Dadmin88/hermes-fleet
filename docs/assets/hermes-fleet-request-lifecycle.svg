<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hermes Fleet Request Lifecycle</title><desc id="desc">Exact-node Fleet request path and the direct-versus-executable operation split.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
  <linearGradient id="fleet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b167d"/><stop offset="1" stop-color="#191039"/></linearGradient>
  <filter id="glowP"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowG"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker>
  <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#84cc16"/></marker>
  <style>.title{font:700 52px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.h{font:700 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.hh{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;fill:#8b5cf6}.hg{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;fill:#84cc16}.b{font:600 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.s{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#aab3c5}.xs{font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#aab3c5}.p{fill:none;stroke:#8b5cf6;stroke-width:3;marker-end:url(#arrowP)}.g{fill:none;stroke:#84cc16;stroke-width:3;marker-end:url(#arrowG)}.pd{fill:none;stroke:#8b5cf6;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowP)}.gd{fill:none;stroke:#84cc16;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowG)}.card{fill:#0f1420;stroke:#3a4256;stroke-width:1.5}.pcard{fill:#121827;stroke:#8b5cf6;stroke-width:1.8}.gcard{fill:#121827;stroke:#84cc16;stroke-width:1.8}</style>
</defs><rect width="1600" height="900" fill="url(#bg)"/>
<g transform="translate(34 28)"><path d="M8 8h42l-18 10h30L35 30h28L30 42h18L25 56 15 39 3 32l20-2L9 22h24z" fill="#8b5cf6" filter="url(#glowP)"/><text x="78" y="46" class="title">Hermes Fleet Request Lifecycle</text></g>
<rect x="35" y="190" width="180" height="250" rx="18" class="pcard"/><rect x="55" y="215" width="58" height="58" rx="12" fill="#0b101a" stroke="#8b5cf6" stroke-width="1.5"/><circle cx="84" cy="234" r="9" fill="none" stroke="#8b5cf6" stroke-width="3"/><path d="M68 260q16-18 32 0M64 267h40" fill="none" stroke="#8b5cf6" stroke-width="3"/><text x="125" y="305" class="h" text-anchor="middle">Operator /</text><text x="125" y="335" class="hh" text-anchor="middle">Calling Agent</text><text x="125" y="380" class="s" text-anchor="middle"><tspan x="125" dy="0">CLI, SDK, API</tspan><tspan x="125" dy="23">or automation</tspan></text>
<rect x="350" y="180" width="210" height="290" rx="18" class="pcard"/><text x="455" y="260" class="h" text-anchor="middle">Hermes Fleet</text><text x="455" y="292" class="hh" text-anchor="middle">CONTROL PLANE</text><text x="415" y="350" class="s"><tspan x="415" dy="0">Authorization</tspan><tspan x="415" dy="28">Readiness</tspan><tspan x="415" dy="28">Selection</tspan></text>
<rect x="665" y="190" width="210" height="220" rx="18" class="pcard"/><text x="770" y="280" class="h" text-anchor="middle">Hermes Keryx</text><text x="770" y="315" class="hh" text-anchor="middle">TRANSPORT</text><text x="770" y="355" class="s" text-anchor="middle"><tspan x="770" dy="0">Authenticated transport,</tspan><tspan x="770" dy="23">durable tasks/results</tspan></text>
<rect x="980" y="190" width="180" height="220" rx="18" class="pcard"/><text x="1070" y="280" class="h" text-anchor="middle">fleet-node</text><text x="1070" y="315" class="hh" text-anchor="middle">DISPATCH</text><text x="1070" y="355" class="s" text-anchor="middle"><tspan x="1070" dy="0">Operation validation,</tspan><tspan x="1070" dy="23">dispatch</tspan></text>
<rect x="1265" y="190" width="210" height="220" rx="18" class="pcard"/><text x="1370" y="280" class="h" text-anchor="middle">Hermes Agent</text><text x="1370" y="315" class="hh" text-anchor="middle">RUNTIME</text><text x="1370" y="355" class="s" text-anchor="middle"><tspan x="1370" dy="0">Local tools, models,</tspan><tspan x="1370" dy="23">sessions, Runs execution</tspan></text>
<path d="M215 315 L350 315" class="p"/><circle cx="282" cy="260" r="20" fill="#8b5cf6"/><text x="282" y="267" class="b" text-anchor="middle">1</text><text x="282" y="297" class="xs" text-anchor="middle">exact node request</text>
<path d="M560 315 L665 315" class="p"/><circle cx="612" cy="260" r="20" fill="#8b5cf6"/><text x="612" y="267" class="b" text-anchor="middle">2</text><text x="612" y="297" class="xs" text-anchor="middle">resolve + authorize</text>
<path d="M875 315 L980 315" class="p"/><circle cx="927" cy="260" r="20" fill="#8b5cf6"/><text x="927" y="267" class="b" text-anchor="middle">3</text><text x="927" y="297" class="xs" text-anchor="middle">bounded Fleet request</text>
<path d="M1160 315 L1265 315" class="p"/><circle cx="1212" cy="260" r="20" fill="#8b5cf6"/><text x="1212" y="267" class="b" text-anchor="middle">4</text><text x="1212" y="297" class="xs" text-anchor="middle">authenticated delivery</text>
<circle cx="1510" cy="250" r="20" fill="#8b5cf6"/><text x="1510" y="257" class="b" text-anchor="middle">5</text><text x="1510" y="292" class="xs" text-anchor="middle"><tspan x="1510" dy="0">validate operation</tspan><tspan x="1510" dy="23">+ policy</tspan></text>
<rect x="820" y="520" width="350" height="105" rx="18" class="gcard"/><text x="995" y="565" class="b" text-anchor="middle">DIRECT FLEET OPERATIONS</text><text x="995" y="595" class="s" text-anchor="middle">No local Hermes run</text>
<rect x="820" y="665" width="350" height="105" rx="18" class="pcard"/><text x="995" y="710" class="b" text-anchor="middle">EXPLICIT HERMES EXECUTION</text><text x="995" y="740" class="s" text-anchor="middle">Local Hermes run is started</text>
<path d="M770 410 L770 575 L820 575" class="p"/><path d="M770 410 L770 720 L820 720" class="p"/><path d="M1350 410 L1350 575 L1170 575" class="gd"/><text x="1245" y="548" class="hg" text-anchor="middle">6  direct op → bounded result</text><path d="M1350 410 L1350 720 L1170 720" class="pd"/><text x="1245" y="693" class="hh" text-anchor="middle">7  fleet.hermes.run → Hermes</text>
<rect x="1205" y="505" width="330" height="150" rx="18" class="gcard"/><text x="1370" y="535" class="hg" text-anchor="middle">DIRECT OPERATIONS</text><text x="1240" y="575" class="b"><tspan x="1240" dy="0">fleet.health</tspan><tspan x="1240" dy="23">fleet.inventory</tspan><tspan x="1240" dy="23">fleet.message</tspan></text>
<rect x="1205" y="675" width="330" height="90" rx="18" class="pcard"/><text x="1370" y="705" class="hh" text-anchor="middle">EXECUTABLE OPERATION</text><text x="1370" y="742" class="b" text-anchor="middle">fleet.hermes.run</text>
<path d="M770 410 L770 805 L455 805 L455 470" class="p"/><circle cx="650" cy="805" r="20" fill="#8b5cf6"/><text x="650" y="812" class="b" text-anchor="middle">8</text><text x="650" y="840" class="xs" text-anchor="middle">durable result</text><path d="M455 470 L455 820 L125 820 L125 440" class="p"/><circle cx="330" cy="820" r="20" fill="#8b5cf6"/><text x="330" y="827" class="b" text-anchor="middle">9</text><text x="330" y="855" class="xs" text-anchor="middle">reattach / return result</text>
<rect x="40" y="845" width="1520" height="42" rx="12" class="card"/><text x="800" y="872" class="s" text-anchor="middle">Only the explicit fleet.hermes.run operation enters Hermes. Exact-node requests are not silently retargeted.</text></svg>