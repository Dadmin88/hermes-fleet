<rect x="42" y="650" width="410" height="125" rx="18" class="green"/><rect x="66" y="681" width="62" height="62" rx="12" fill="#09111f" stroke="#b6ff00" stroke-width="2"/>
<rect x="82" y="708" width="30" height="25" rx="4" fill="none" stroke="#b6ff00" stroke-width="3"/><path d="M87 708v-9a10 10 0 0 1 20 0v9" fill="none" stroke="#b6ff00" stroke-width="3"/>
<text x="150" y="699" class="name">Hermes Keryx</text><text x="150" y="730" class="body">Authenticated transport,</text><text x="150" y="754" class="body">durable tasks / results</text>
