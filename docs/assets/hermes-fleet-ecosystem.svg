<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hermes Fleet Ecosystem</title>
<desc id="desc">High-contrast map of the Hermes Fleet ecosystem and component boundaries.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050812"/><stop offset="1" stop-color="#09111f"/></linearGradient>
  <linearGradient id="fleet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1530"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l11-4z" fill="#a855f7"/></marker>
  <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l11-4z" fill="#b6ff00"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:54px;font-weight:800;fill:#ffffff}
    .sectionP{font-size:18px;font-weight:800;letter-spacing:1.4px;fill:#c084fc}
    .sectionG{font-size:18px;font-weight:800;letter-spacing:1.4px;fill:#b6ff00}
    .name{font-size:24px;font-weight:760;fill:#ffffff}
    .body{font-size:17px;font-weight:450;fill:#cbd5e1}
    .small{font-size:15px;font-weight:500;fill:#cbd5e1}
    .flow{font-size:16px;font-weight:750;fill:#ffffff}
    .cap{font-size:18px;font-weight:700;fill:#ffffff}
    .card{fill:#101827;stroke:#334155;stroke-width:1.5}
    .purple{fill:#101827;stroke:#a855f7;stroke-width:2}
    .green{fill:#101827;stroke:#b6ff00;stroke-width:2}
    .fleet{fill:url(#fleet);stroke:#a855f7;stroke-width:2.5}
    .p{fill:none;stroke:#a855f7;stroke-width:3;marker-end:url(#ap)}
    .pd{fill:none;stroke:#a855f7;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#ap)}
    .g{fill:none;stroke:#b6ff00;stroke-width:3;marker-end:url(#ag)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<!-- Title -->
<g transform="translate(38 30)"><path d="M6 8h52L38 19h31L35 32h31L30 47h24L24 63 13 43 2 35l23-3L10 22h31z" fill="#a855f7"/><text x="82" y="49" class="title">Hermes Fleet Ecosystem</text></g>
<!-- Operator -->
<text x="800" y="122" class="sectionG" text-anchor="middle">OPERATOR SURFACES</text>
<line x1="470" y1="116" x2="690" y2="116" stroke="#b6ff00" stroke-width="2"/><line x1="910" y1="116" x2="1130" y2="116" stroke="#b6ff00" stroke-width="2"/>
<rect x="455" y="140" width="690" height="105" rx="18" class="purple"/>
<rect x="490" y="164" width="64" height="58" rx="10" fill="#0a1020" stroke="#a855f7" stroke-width="2"/>
<path d="M506 181l12 11-12 11m18 0h14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
