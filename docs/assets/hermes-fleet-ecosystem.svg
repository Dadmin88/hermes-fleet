<rect x="505" y="286" width="590" height="278" rx="24" class="fleet"/>
<text x="800" y="360" class="title" text-anchor="middle">Hermes Fleet</text><text x="800" y="402" class="body" text-anchor="middle" style="font-size:20px;font-weight:800;letter-spacing:1.5px">CONTROL PLANE</text>
<line x1="555" y1="420" x2="1045" y2="420" stroke="#475569" stroke-width="1.5"/>
<g><rect x="575" y="442" width="78" height="70" rx="14" fill="#0a1020" stroke="#a855f7" stroke-width="2"/><path d="M614 452l22 9v16c0 15-9 26-22 32-13-6-22-17-22-32v-16z" fill="none" stroke="#a855f7" stroke-width="4"/><text x="614" y="540" class="cap" text-anchor="middle">Authorization</text></g>
<g><rect x="761" y="442" width="78" height="70" rx="14" fill="#0a1020" stroke="#a855f7" stroke-width="2"/><circle cx="800" cy="477" r="24" fill="none" stroke="#a855f7" stroke-width="4"/><path d="M788 477l9 10 17-21" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="800" y="540" class="cap" text-anchor="middle">Readiness</text></g>
<g><rect x="947" y="442" width="78" height="70" rx="14" fill="#0a1020" stroke="#a855f7" stroke-width="2"/><circle cx="986" cy="477" r="21" fill="none" stroke="#a855f7" stroke-width="4"/><circle cx="986" cy="477" r="8" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M986 447v12m0 36v12m-30-30h12m36 0h12" stroke="#a855f7" stroke-width="3"/><text x="986" y="540" class="cap" text-anchor="middle">Selection</text></g>
<!-- Right Agency -->
<text x="1268" y="255" class="sectionG">PROFILE SOURCE</text><line x1="1268" y1="265" x2="1542" y2="265" stroke="#b6ff00" stroke-width="2"/>
<rect x="1248" y="282" width="305" height="132" rx="18" class="green"/><rect x="1272" y="315" width="62" height="62" rx="12" fill="#09111f" stroke="#b6ff00" stroke-width="2"/>
<circle cx="1303" cy="334" r="9" fill="none" stroke="#b6ff00" stroke-width="3"/><path d="M1286 362q17-20 34 0" fill="none" stroke="#b6ff00" stroke-width="3"/>
<text x="1355" y="335" class="name">Hermes Agency</text><text x="1355" y="367" class="body">Professional profile</text><text x="1355" y="391" class="body">distributions</text>
<!-- Bottom node/runtime -->
<text x="648" y="622" class="sectionP">FLEET NODE</text><line x1="648" y1="632" x2="955" y2="632" stroke="#a855f7" stroke-width="2"/>
<rect x="625" y="650" width="350" height="125" rx="18" class="purple"/><rect x="649" y="681" width="62" height="62" rx="12" fill="#09111f" stroke="#a855f7" stroke-width="2"/>
<rect x="661" y="692" width="38" height="10" rx="3" fill="none" stroke="#a855f7" stroke-width="3"/><rect x="661" y="706" width="38" height="10" rx="3" fill="none" stroke="#a855f7" stroke-width="3"/><rect x="661" y="720" width="38" height="10" rx="3" fill="none" stroke="#a855f7" stroke-width="3"/>
<text x="735" y="701" class="name">fleet-node</text><text x="735" y="732" class="body">Operation validation,</text><text x="735" y="756" class="body">dispatch</text>
<text x="1104" y="622" class="sectionP">RUNTIME LAYER</text><line x1="1104" y1="632" x2="1460" y2="632" stroke="#a855f7" stroke-width="2"/>
<rect x="1080" y="650" width="390" height="125" rx="18" class="purple"/><rect x="1104" y="681" width="62" height="62" rx="12" fill="#09111f" stroke="#a855f7" stroke-width="2"/>
<path d="M1121 699l13 13-13 13m19 0h12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1190" y="701" class="name">Hermes Agent</text><text x="1190" y="732" class="body">Local tools, models,</text><text x="1190" y="756" class="body">sessions, Runs execution</text>
<!-- Flows -->
<path d="M800 245V286" class="p"/>
<path d="M412 311H505" class="g"/>
<path d="M412 498H505" class="g"/><text x="430" y="477" class="flow">managed state</text>
<path d="M625 564v42H258v44" class="p"/><text x="430" y="595" class="flow">bounded request</text>
<path d="M452 712H625" class="p"/><text x="492" y="690" class="flow">authenticated delivery</text>
<path d="M975 712h105" class="p"/>
<path d="M800 650v-86" class="pd"/><text x="825" y="608" class="flow">readiness / profile info</text>
<path d="M1400 414v206h5v30" class="g"/><text x="1418" y="584" class="flow">profile packages</text>
<path d="M1275 775v36H258v-36" class="p"/><text x="770" y="834" class="flow">durable result</text>
<!-- Footer -->
<rect x="44" y="850" width="1512" height="38" rx="12" class="card"/><text x="800" y="876" class="small" text-anchor="middle">Fleet coordinates the system through contracts; it does not replace the network, transport, runtime, or profile source.</text>
</svg>