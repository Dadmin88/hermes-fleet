<rect x="42" y="437" width="370" height="122" rx="18" class="green"/><rect x="66" y="468" width="62" height="62" rx="12" fill="#09111f" stroke="#b6ff00" stroke-width="2"/>
<circle cx="97" cy="487" r="9" fill="none" stroke="#b6ff00" stroke-width="3"/><path d="M80 515q17-20 34 0" fill="none" stroke="#b6ff00" stroke-width="3"/>
