<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Node Readiness and Exact Profile Eligibility</title>
<desc id="desc">High-contrast explanation of scheduler readiness and exact native profile eligibility.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050812"/><stop offset="1" stop-color="#09111f"/></linearGradient>
  <marker id="ap" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#a855f7"/></marker>
  <marker id="ag" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#b6ff00"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .title{font-size:48px;font-weight:800;fill:#fff}.sub{font-size:21px;font-weight:500;fill:#cbd5e1}
    .head{font-size:25px;font-weight:800;fill:#fff}.name{font-size:19px;font-weight:720;fill:#fff}.body{font-size:16px;font-weight:450;fill:#cbd5e1}.status{font-size:17px;font-weight:800;fill:#fff}.small{font-size:15px;font-weight:500;fill:#cbd5e1}
    .pcard{fill:#101827;stroke:#a855f7;stroke-width:1.8}.gcard{fill:#101827;stroke:#b6ff00;stroke-width:1.8}.muted{fill:#0d1523;stroke:#475569;stroke-width:1.5}
    .warn{fill:#101827;stroke:#fbbf24;stroke-width:1.8}.bad{fill:#101827;stroke:#fb7185;stroke-width:1.8}
    .p{fill:none;stroke:#a855f7;stroke-width:2.8;marker-end:url(#ap)}.g{fill:none;stroke:#b6ff00;stroke-width:2.8;marker-end:url(#ag)}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g transform="translate(32 24)"><path d="M6 8h44L33 18h27L31 30h27L27 43h20L22 56 12 39 2 32l20-3L9 21h27z" fill="#a855f7"/><text x="66" y="45" class="title">Node Readiness and Exact Profile Eligibility</text><text x="66" y="79" class="sub">Readiness and exact package presence are different questions</text></g>
<!-- Section 1 -->
<rect x="28" y="120" width="685" height="515" rx="20" fill="none" stroke="#a855f7" stroke-width="2"/><circle cx="190" cy="153" r="21" fill="#a855f7"/><text x="190" y="161" text-anchor="middle" class="head">1</text><text x="225" y="163" class="head">Scheduler readiness</text>
<!-- Checklist rows -->
<g>
  <circle cx="90" cy="207" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="214" text-anchor="middle" class="name">1</text><rect x="145" y="183" width="525" height="48" rx="10" class="muted"/><text x="210" y="214" class="name">Managed identity active</text><circle cx="180" cy="207" r="8" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="90" cy="258" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="265" text-anchor="middle" class="name">2</text><rect x="145" y="234" width="525" height="48" rx="10" class="muted"/><text x="210" y="265" class="name">Observation fresh</text><path d="M168 258h8l6-12 8 24 7-12h10" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="90" cy="309" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="316" text-anchor="middle" class="name">3</text><rect x="145" y="285" width="525" height="48" rx="10" class="muted"/><text x="210" y="316" class="name">Network / control reachable</text><circle cx="180" cy="309" r="9" fill="none" stroke="#a855f7" stroke-width="2.5"/><path d="M180 294v6m0 18v6m-15-15h6m18 0h6" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="90" cy="360" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="367" text-anchor="middle" class="name">4</text><rect x="145" y="336" width="525" height="48" rx="10" class="muted"/><text x="210" y="367" class="name">Keryx available</text><rect x="169" y="353" width="22" height="18" rx="3" fill="none" stroke="#a855f7" stroke-width="2.5"/><path d="M173 353v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="90" cy="411" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="418" text-anchor="middle" class="name">5</text><rect x="145" y="387" width="525" height="48" rx="10" class="muted"/><text x="210" y="418" class="name">Hermes available</text><path d="M166 397h28l-11 7h17l-20 8h18l-21 9h14l-18 9-8-13-7-5 13-2-8-6h18z" fill="#a855f7"/>
  <circle cx="90" cy="462" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="469" text-anchor="middle" class="name">6</text><rect x="145" y="438" width="525" height="48" rx="10" class="muted"/><text x="210" y="469" class="name">Fleet worker available</text><g stroke="#a855f7" fill="none" stroke-width="2.5"><rect x="165" y="449" width="30" height="7" rx="2"/><rect x="165" y="459" width="30" height="7" rx="2"/><rect x="165" y="469" width="30" height="7" rx="2"/></g>
  <circle cx="90" cy="513" r="18" fill="#09111f" stroke="#a855f7" stroke-width="2"/><text x="90" y="520" text-anchor="middle" class="name">7</text><rect x="145" y="489" width="525" height="48" rx="10" class="muted"/><text x="210" y="520" class="name">At least one Fleet-owned execution slot free</text><rect x="167" y="501" width="26" height="24" rx="4" fill="none" stroke="#a855f7" stroke-width="2.5"/>
</g>
<path d="M377 537v34" class="p"/><rect x="120" y="573" width="530" height="48" rx="12" class="gcard"/><circle cx="205" cy="597" r="14" fill="none" stroke="#b6ff00" stroke-width="3"/><path d="M198 597l5 6 10-12" fill="none" stroke="#fff" stroke-width="3"/><text x="245" y="605" class="head">scheduler_ready = true</text>
<!-- Section 2 -->
<rect x="744" y="120" width="828" height="515" rx="20" fill="none" stroke="#b6ff00" stroke-width="2"/><circle cx="890" cy="153" r="21" fill="#b6ff00"/><text x="890" y="161" text-anchor="middle" style="font:800 25px Inter,system-ui;fill:#07110a">2</text><text x="925" y="163" class="head">Exact native carrier</text>
<rect x="772" y="205" width="360" height="190" rx="16" class="pcard"/><circle cx="825" cy="260" r="25" fill="none" stroke="#a855f7" stroke-width="3"/><path d="M814 260l8 9 16-19" fill="none" stroke="#fff" stroke-width="4"/><text x="870" y="268" class="head">scheduler_ready = true</text><text x="800" y="330" class="body">Node passes all readiness checks</text><text x="800" y="354" class="body">from Section 1.</text>
<text x="1165" y="292" style="font:800 48px Inter,system-ui;fill:#b6ff00">+</text>
<rect x="1200" y="205" width="340" height="190" rx="16" class="gcard"/><path d="M1235 245l22-12 22 12-22 12zM1235 245v25l22 12 22-12v-25" fill="none" stroke="#b6ff00" stroke-width="3"/><text x="1295" y="246" class="name">Current observation proves</text><text x="1295" y="272" class="name">exact requested package identity</text><text x="1235" y="330" class="body">Exact identity = name + version</text><text x="1235" y="354" class="body">+ content digest</text>
<path d="M1340 395v42H1160v34" class="g"/><rect x="800" y="474" width="700" height="120" rx="16" class="gcard"/><path d="M850 495l28 11v20c0 18-11 31-28 39-17-8-28-21-28-39v-20z" fill="none" stroke="#b6ff00" stroke-width="4"/><path d="M836 530l10 11 20-25" fill="none" stroke="#fff" stroke-width="4"/><text x="920" y="520" class="head">Exact ready native carrier</text><text x="920" y="555" class="body">Node is ready AND the exact requested profile package is proven present.</text>
<!-- Common cases -->
<rect x="28" y="650" width="1544" height="185" rx="18" fill="none" stroke="#a855f7" stroke-width="1.6"/><circle cx="90" cy="678" r="17" fill="#a855f7"/><text x="90" y="685" text-anchor="middle" class="name">3</text><text x="120" y="686" class="head">Common cases</text>
<rect x="62" y="705" width="330" height="106" rx="14" class="gcard"/><text x="95" y="735" class="name">Ready + exact package present</text><text x="95" y="773" class="status" style="fill:#b6ff00">✓ Eligible</text>
<rect x="415" y="705" width="350" height="106" rx="14" class="warn"/><text x="448" y="735" class="name">Ready + wrong package / wrong digest</text><text x="448" y="773" class="status" style="fill:#fbbf24">✕ Not exact</text>
<rect x="788" y="705" width="350" height="106" rx="14" class="warn"/><text x="821" y="735" class="name">Ready + package absent</text><text x="821" y="773" class="status" style="fill:#fb923c">✕ Not eligible</text>
<rect x="1162" y="705" width="376" height="106" rx="14" class="bad"/><text x="1195" y="735" class="name">Exact package present + node stale</text><text x="1195" y="773" class="status" style="fill:#fb7185">✕ Not ready</text>
<!-- Footer -->
<rect x="44" y="850" width="1512" height="38" rx="12" class="muted"/><text x="800" y="876" class="small" text-anchor="middle">Fleet derives readiness from current evidence. Exact package presence is a separate proof layered on top of readiness.</text>
</svg>