<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Node Readiness and Exact Profile Eligibility</title><desc id="desc">Scheduler readiness and exact package presence are separate facts that combine for exact native carrier eligibility.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient><filter id="glowP"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker><marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#84cc16"/></marker><style>.title{font:700 52px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.h{font:700 24px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.hh{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;fill:#8b5cf6}.hg{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;fill:#84cc16}.b{font:600 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.s{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#aab3c5}.p{fill:none;stroke:#8b5cf6;stroke-width:3;marker-end:url(#arrowP)}.g{fill:none;stroke:#84cc16;stroke-width:3;marker-end:url(#arrowG)}.pd{fill:none;stroke:#8b5cf6;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowP)}.gd{fill:none;stroke:#84cc16;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowG)}.card{fill:#0f1420;stroke:#3a4256;stroke-width:1.5}.pcard{fill:#121827;stroke:#8b5cf6;stroke-width:1.8}.gcard{fill:#121827;stroke:#84cc16;stroke-width:1.8}</style></defs><rect width="1600" height="900" fill="url(#bg)"/>
<g transform="translate(34 28)"><path d="M8 8h42l-18 10h30L35 30h28L30 42h18L25 56 15 39 3 32l20-2L9 22h24z" fill="#8b5cf6" filter="url(#glowP)"/><text x="78" y="46" class="title">Node Readiness and Exact Profile Eligibility</text></g>
<rect x="220" y="125" width="520" height="560" rx="18" class="pcard"/><rect x="860" y="125" width="520" height="560" rx="18" class="gcard"/><text x="480" y="170" class="hh" text-anchor="middle">SCHEDULER READINESS</text><text x="1120" y="170" class="hg" text-anchor="middle">EXACT PROFILE PRESENCE</text><text x="480" y="205" class="s" text-anchor="middle">Can this node accept Fleet-owned work now?</text><text x="1120" y="205" class="s" text-anchor="middle">Does this node already have the exact package?</text>
<rect x="285" y="235" width="390" height="50" rx="12" class="card"/><text x="355" y="266" class="b">Managed identity active</text><rect x="285" y="301" width="390" height="50" rx="12" class="card"/><text x="355" y="332" class="b">Fresh observation</text><rect x="285" y="367" width="390" height="50" rx="12" class="card"/><text x="355" y="398" class="b">Keryx available</text><rect x="285" y="433" width="390" height="50" rx="12" class="card"/><text x="355" y="464" class="b">Hermes available</text><rect x="285" y="499" width="390" height="50" rx="12" class="card"/><text x="355" y="530" class="b">Fleet worker available</text><rect x="285" y="565" width="390" height="50" rx="12" class="card"/><text x="355" y="596" class="b">Fleet slot available</text>
<rect x="925" y="255" width="390" height="56" rx="12" class="card"/><text x="995" y="289" class="b">Profile observed on node</text><rect x="925" y="338" width="390" height="56" rx="12" class="card"/><text x="995" y="372" class="b">Name matches</text><rect x="925" y="421" width="390" height="56" rx="12" class="card"/><text x="995" y="455" class="b">Version matches</text><rect x="925" y="504" width="390" height="56" rx="12" class="card"/><text x="995" y="538" class="b">Content digest matches</text>
<rect x="285" y="642" width="390" height="70" rx="18" class="pcard"/><text x="480" y="675" class="h" text-anchor="middle">Scheduler-ready</text><text x="480" y="700" class="s" text-anchor="middle">All readiness evidence satisfied</text><rect x="925" y="590" width="390" height="85" rx="18" class="gcard"/><text x="1120" y="625" class="h" text-anchor="middle">Exact package present</text><text x="1120" y="652" class="s" text-anchor="middle">Exact profile identity confirmed</text>
<rect x="25" y="330" width="160" height="180" rx="18" class="pcard"/><text x="105" y="365" class="hh" text-anchor="middle"><tspan x="105" dy="0">Missing or stale</tspan><tspan x="105" dy="23">evidence fails</tspan><tspan x="105" dy="23">closed.</tspan></text><text x="105" y="445" class="s" text-anchor="middle"><tspan x="105" dy="0">Node is not</tspan><tspan x="105" dy="23">scheduler-ready.</tspan></text><path d="M185 420 L220 420" class="pd"/>
<rect x="1415" y="330" width="160" height="200" rx="18" class="gcard"/><text x="1495" y="365" class="hg" text-anchor="middle"><tspan x="1495" dy="0">Same-name or</tspan><tspan x="1495" dy="23">digestless presence</tspan><tspan x="1495" dy="23">does not satisfy</tspan><tspan x="1495" dy="23">exact lookup.</tspan></text><path d="M1415 435 L1380 435" class="gd"/>
<path d="M480 712 L480 765 L720 765" class="p"/><path d="M1120 675 L1120 765 L880 765" class="g"/><rect x="620" y="735" width="360" height="105" rx="18" class="pcard"/><text x="800" y="775" class="h" text-anchor="middle">Eligible exact native carrier</text><text x="800" y="807" class="s" text-anchor="middle">Scheduler-ready AND exact package present</text><rect x="1080" y="735" width="380" height="105" rx="18" class="pcard"/><text x="1270" y="775" class="h" text-anchor="middle">Placement / Recipe candidate</text><text x="1270" y="807" class="s" text-anchor="middle">Ready node may be usable even when native package is absent</text><path d="M980 787 L1080 787" class="pd"/>
<rect x="40" y="850" width="1520" height="35" rx="10" class="card"/><text x="800" y="875" class="s" text-anchor="middle">Readiness answers whether the node can accept work now. Profile identity answers whether the exact package is already present natively.</text></svg>